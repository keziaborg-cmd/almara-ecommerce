# Fontes de conteúdo pro pipeline do blog, agrupadas pelas mesmas 4
# categorias do blog do site (sono, ansiedade, produtividade, pausa).
#
# Fontes testadas em 2026-10-18: todas respondem ao feedparser sem bloqueio e
# publicaram na semana do teste. Fontes que caíram e foram trocadas: Sleep
# Foundation (feed parado desde 2025-11), ADAA (bloqueia acesso automatizado)
# e HBR por página (sem feed; entrou o feed antigo da HBR, que ainda funciona).
# A classificação escolhe os melhores itens por categoria; mais fontes = mais
# opção, não mais artigos.
#
# "type: rss" é o único tipo totalmente implementado nesta primeira versão.
# Uma fonte "type: page" (uma página sem feed RSS) fica registrada aqui,
# mas o coletor (pipeline/collect.py) só loga que ela existe e pula —
# scraping genérico de página HTML não foi implementado, porque extrair
# título/data/resumo de forma confiável varia demais de site pra site.
# Pra usar uma fonte dessas de verdade, ache o feed RSS dela (a maioria dos
# blogs/sites de notícia tem um, mesmo sem link visível — ex.: testar
# "/feed" ou "/rss" no fim da URL) ou peça pra implementar um parser
# específico pra esse site.

sono:
  - name: "Medical Xpress — Sono"
    type: rss
    url: "https://medicalxpress.com/rss-feed/sleep-news/"
  - name: "ScienceDaily — Insônia"
